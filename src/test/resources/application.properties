# Test configuration: Isolated in-memory H2 database
server.port=0
java.awt.headless=true
spring.main.headless=true

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.chat-model=llama3.2
ollama.timeout-seconds=5

indexer.chunking.default-strategy=SEMANTIC_PARAGRAPH
indexer.chunking.target-chunk-size=400
indexer.chunking.overlap-sentences=1
indexer.search.hybrid-alpha=0.5
