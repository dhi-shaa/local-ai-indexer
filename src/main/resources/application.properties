# Server configuration for headless desktop UI interaction
server.port=8080
server.address=127.0.0.1

# Headless configuration for JavaFX pairing
java.awt.headless=true
spring.main.headless=true

# H2 Database Zero-Configuration Local Vector Storage
spring.datasource.url=jdbc:h2:file:./data/local_indexer_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

# Ollama Local LLM Configuration
ollama.base-url=http://127.0.0.1:11434
ollama.embedding-model=nomic-embed-text
ollama.chat-model=phi3
ollama.timeout-seconds=120
ollama.num-ctx=4096
ollama.temperature=0.2
ollama.debug-prompt=true

# Ingestion & Chunking Defaults
indexer.chunking.default-strategy=SEMANTIC_PARAGRAPH
indexer.chunking.target-chunk-size=400
indexer.chunking.overlap-sentences=1

# Search & Relevance Tuning
indexer.search.hybrid-alpha=0.5
indexer.search.min-score-threshold=0.35
indexer.search.max-llm-chunks=5
indexer.search.enable-query-expansion=true
indexer.search.exclude-references=false
indexer.search.reference-weight-multiplier=0.3
indexer.search.include-internal-docs=false
